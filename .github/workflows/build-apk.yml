name: Build BOUH AL-TADARIS Field APK v3

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Generate offline Android project
        run: |
          rm -rf generated_app
          mkdir -p generated_app/app/src/main/java/com/bouh/altadarisfield
          mkdir -p generated_app/app/src/main/res/values
          mkdir -p generated_app/app/src/main/assets

          cat > generated_app/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name='BOUH AL TADARIS FIELD'
          include ':app'
          EOF

          cat > generated_app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > generated_app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.bouh.altadarisfield'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.bouh.altadarisfield'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '3.0.0-field'
              }
          }
          EOF

          cat > generated_app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#060606</item>
                  <item name="android:navigationBarColor">#060606</item>
                  <item name="android:windowFullscreen">false</item>
              </style>
          </resources>
          EOF

          cat > generated_app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- android.permission.INTERNET IS STRICTLY FORBIDDEN -->
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.VIBRATE"/>

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme"
                  android:label="بوح التضاريس">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > generated_app/app/src/main/java/com/bouh/altadarisfield/MainActivity.java <<'EOF'
          package com.bouh.altadarisfield;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationManager;
          import android.os.Bundle;
          import android.os.Vibrator;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView webView;
              private LocationManager locationManager;
              private static final int REQ = 404;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  locationManager = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setGeolocationEnabled(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });

                  webView.addJavascriptInterface(new Bridge(), "BOUH");
                  if (android.os.Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(new String[]{
                          Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.ACCESS_COARSE_LOCATION,
                          Manifest.permission.RECORD_AUDIO
                      }, REQ);
                  }
                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class Bridge {
                  @JavascriptInterface
                  public String lastLocation() {
                      try {
                          if (android.os.Build.VERSION.SDK_INT >= 23 &&
                              checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                              return "{\"ok\":false,\"error\":\"NO_PERMISSION\"}";
                          }
                          Location best = null;
                          for (String p : locationManager.getProviders(true)) {
                              Location l = locationManager.getLastKnownLocation(p);
                              if (l != null && (best == null || l.getAccuracy() < best.getAccuracy())) best = l;
                          }
                          if (best == null) return "{\"ok\":false,\"error\":\"NO_FIX\"}";
                          return "{\"ok\":true,\"lat\":" + best.getLatitude() +
                                  ",\"lon\":" + best.getLongitude() +
                                  ",\"acc\":" + best.getAccuracy() +
                                  ",\"alt\":" + best.getAltitude() +
                                  ",\"speed\":" + best.getSpeed() +
                                  ",\"bearing\":" + best.getBearing() + "}";
                      } catch (Exception e) {
                          return "{\"ok\":false,\"error\":\"GPS_ERROR\"}";
                      }
                  }

                  @JavascriptInterface
                  public void vibrate(int ms) {
                      try {
                          Vibrator v = (Vibrator)getSystemService(Context.VIBRATOR_SERVICE);
                          if (v != null) v.vibrate(ms);
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF

          cat > generated_app/app/src/main/assets/bouh_data.json <<'EOF'
          {
            "truth_policy": "Field-check only. No economic gold proof without assay and QA/QC.",
            "developer": "Ahmed Abu Aziza Al-Rashidi",

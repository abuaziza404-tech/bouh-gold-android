name: Build BOUH GOLD PRO ULTRA APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Generate full Android project
        run: |
          rm -rf generated_app
          mkdir -p generated_app/app/src/main/java/com/bouh/goldproultra
          mkdir -p generated_app/app/src/main/res/values
          mkdir -p generated_app/app/src/main/assets

          cat > generated_app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name='BOUH GOLD PRO ULTRA'
          include ':app'
          EOF

          cat > generated_app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > generated_app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bouh.goldproultra'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.bouh.goldproultra'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF

          cat > generated_app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B1120</item>
                  <item name="android:navigationBarColor">#0B1120</item>
              </style>
          </resources>
          EOF

          cat > generated_app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  android:label="BOUH GOLD PRO ULTRA">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > generated_app/app/src/main/java/com/bouh/goldproultra/MainActivity.java <<'EOF'
          package com.bouh.goldproultra;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationManager;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView webView;
              private LocationManager locationManager;
              private static final int REQ_LOCATION = 700;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  locationManager = (LocationManager) getSystemService(Context.LOCATION_SERVICE);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  webView.addJavascriptInterface(new Bridge(), "BOUH");
                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, REQ_LOCATION);
                  }
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_LOCATION && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "GPS enabled", Toast.LENGTH_SHORT).show();
                  }
              }

              public class Bridge {
                  @JavascriptInterface
                  public String lastLocation() {
                      try {
                          if (android.os.Build.VERSION.SDK_INT >= 23 &&
                              checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                              return "{\"ok\":false,\"error\":\"NO_PERMISSION\"}";
                          }
                          Location best = null;
                          for (String p : locationManager.getProviders(true)) {
                              Location l = locationManager.getLastKnownLocation(p);
                              if (l != null && (best == null || l.getAccuracy() < best.getAccuracy())) best = l;
                          }
                          if (best == null) return "{\"ok\":false,\"error\":\"NO_FIX\"}";
                          return "{\"ok\":true,\"lat\":" + best.getLatitude() + ",\"lon\":" + best.getLongitude() + ",\"acc\":" + best.getAccuracy() + "}";
                      } catch (Exception e) {
                          return "{\"ok\":false,\"error\":\"GPS_ERROR\"}";
                      }
                  }
              }
          }
          EOF

          cat > generated_app/app/src/main/assets/targets.csv <<'EOF'
          id,lat,lon,name,class,priority,radius_m,note
          DEMO-01,19.789000,36.451000,Demo Radar Circle,Example,HOLD,30,Example only - replace with real field data
          EOF

          cat > generated_app/app/src/main/assets/layers.geojson <<'EOF'
          {"type":"FeatureCollection","features":[
            {"type":"Feature","properties":{"name":"Demo Structure Corridor","class":"Structure","priority":"HOLD"},"geometry":{"type":"LineString","coordinates":[[36.42,19.78],[36.45,19.80],[36.48,19.83]]}},
            {"type":"Feature","properties":{"name":"Demo Target","class":"Radar-30m","priority":"Example"},"geometry":{"type":"Point","coordinates":[36.451,19.789]}}
          ]}
          EOF

          cat > generated_app/app/src/main/assets/index.html <<'EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8"/>
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
          <title>BOUH GOLD PRO ULTRA</title>
          <style>
          html,body{margin:0;height:100%;overflow:hidden;background:#0b1120;color:#fff;font-family:Arial,Tahoma,sans-serif}
          #top{height:64px;background:#111827;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #374151;gap:10px}
          #logo{width:42px;height:42px;border-radius:14px;background:radial-gradient(circle,#facc15,#92400e,#111827)}
          #title{flex:1}.big{font-weight:800;font-size:16px}.small{font-size:11px;color:#9ca3af}
          button{background:#1f2937;color:#fff;border:1px solid #374151;border-radius:12px;padding:9px;font-weight:700}
          #map{position:absolute;top:64px;bottom:0;left:0;right:0;background:
          radial-gradient(circle at 20% 20%,rgba(250,204,21,.18),transparent 20%),
          linear-gradient(135deg,rgba(55,65,81,.75),rgba(17,24,39,.98))}
          canvas{position:absolute;inset:0}
          #hud{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(17,24,39,.88);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:10px}
          .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:#1f2937;border-radius:12px;padding:8px}
          .label{font-size:10px;color:#9ca3af}.value{font-weight:800;direction:ltr;text-align:left}
          #tools{position:absolute;right:10px;top:76px;display:flex;flex-direction:column;gap:8px}.tool{width:52px;height:46px}
          #status{position:absolute;left:10px;right:10px;top:76px;text-align:center;font-size:12px;color:#fff;background:rgba(0,0,0,.28);border-radius:10px;padding:6px}
          </style>
          </head>
          <body>
          <div id="top"><div id="logo"></div><div id="title"><div class="big">بوح التضاريس | GOLD PRO ULTRA</div><div class="small">GPS • Geological Layers • Remote Sensing • Radar View</div></div><button onclick="locateMe()">GPS</button></div>
          <div id="map"><canvas id="cv"></canvas><div id="status">جاهز للملاحة الميدانية</div><div id="tools"><button class="tool" onclick="zoom++ ; draw()">+</button><button class="tool" onclick="zoom=Math.max(1,zoom-1);draw()">−</button><button class="tool" onclick="radar=!radar;draw()">RAD</button></div><div id="hud"><div class="grid"><div class="card"><div class="label">Latitude</div><div id="lat" class="value">--</div></div><div class="card"><div class="label">Longitude</div><div id="lon" class="value">--</div></div><div class="card"><div class="label">Mode</div><div class="value">BOUH Radar</div></div><div class="card"><div class="label">Zoom</div><div id="z" class="value">12</div></div></div></div></div>
          <script>
          let cv=document.getElementById('cv'),ctx=cv.getContext('2d'),center={lat:19.80,lon:36.48},gps=null,zoom=12,radar=true,targets=[];
          function resize(){cv.width=innerWidth;cv.height=innerHeight-64;draw()} addEventListener('resize',resize);
          function project(lat,lon){let sx=(lon-center.lon)*9000*Math.pow(1.24,zoom-12)+cv.width/2;let sy=(center.lat-lat)*9000*Math.pow(1.24,zoom-12)+cv.height/2;return{x:sx,y:sy}}
          function metersToPixels(m){return m*(zoom/12)*0.8}
          function draw(){ctx.clearRect(0,0,cv.width,cv.height);drawTerrain();drawGrid();drawLayer();if(radar)drawRadar();drawTargets();drawGps();lat.textContent=center.lat.toFixed(6);lon.textContent=center.lon.toFixed(6);z.textContent=zoom}
          function drawTerrain(){let g=ctx.createLinearGradient(0,0,cv.width,cv.height);g.addColorStop(0,'#111827');g.addColorStop(.5,'#3f2f1d');g.addColorStop(1,'#0b1120');ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height)}
          function drawGrid(){ctx.strokeStyle='rgba(255,255,255,.07)';for(let x=0;x<cv.width;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke()}for(let y=0;y<cv.height;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke()}}
          function drawLayer(){ctx.strokeStyle='rgba(103,232,249,.8)';ctx.lineWidth=3;let pts=[[19.78,36.42],[19.80,36.45],[19.83,36.48]];ctx.beginPath();pts.forEach((p,i)=>{let q=project(p[0],p[1]);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke()}
          function drawRadar(){let x=cv.width/2,y=cv.height/2;ctx.strokeStyle='rgba(52,211,153,.55)';for(let r=70;r<cv.width;r+=70){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke()}for(let a=0;a<360;a+=30){let t=a*Math.PI/180;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(t)*cv.width,y+Math.sin(t)*cv.width);ctx.stroke()}}
          function drawTargets(){let p=project(19.789,36.451),r=metersToPixels(30);ctx.fillStyle='rgba(250,204,21,.18)';ctx.strokeStyle='#facc15';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.fillText('DEMO-01',p.x+8,p.y-8)}
          function drawGps(){if(!gps)return;let p=project(gps.lat,gps.lon);ctx.fillStyle='#60a5fa';ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();ctx.stroke()}
          function locateMe(){status.textContent='جار تحديث GPS...';try{let r=JSON.parse(BOUH.lastLocation());if(r.ok){gps=r;center={lat:r.lat,lon:r.lon};status.textContent='GPS OK ±'+Math.round(r.acc)+'m';draw()}else status.textContent='GPS: '+r.error}catch(e){status.textContent='GPS غير متاح الآن'}}
          let drag=false,last={x:0,y:0};cv.onpointerdown=e=>{drag=true;last={x:e.clientX,y:e.clientY}};cv.onpointermove=e=>{if(!drag)return;let dx=e.clientX-last.x,dy=e.clientY-last.y;last={x:e.clientX,y:e.clientY};center.lon-=dx/(9000*Math.pow(1.24,zoom-12));center.lat+=dy/(9000*Math.pow(1.24,zoom-12));draw()};cv.onpointerup=e=>drag=false;
          resize();setInterval(locateMe,25000);
          </script>
          </body></html>
          EOF

      - name: Build debug APK
        run: |
          cd generated_app
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp generated_app/app/build/outputs/apk/debug/app-debug.apk output/BOUH_GOLD_PRO_ULTRA_MapGPS-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_GOLD_PRO_ULTRA_INSTALLABLE_APK
          path: output/BOUH_GOLD_PRO_ULTRA_MapGPS-debug.apk

name: Build BOUH V9 OSMDROID NATIVE APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Generate native Osmdroid project
        run: |
          rm -rf BOUH_V9_OSMDROID_NATIVE
          mkdir -p BOUH_V9_OSMDROID_NATIVE/app/src/main/java/com/bouh/v9osmdroid
          mkdir -p BOUH_V9_OSMDROID_NATIVE/app/src/main/res/values
          mkdir -p BOUH_V9_OSMDROID_NATIVE/app/src/main/res/drawable
          mkdir -p BOUH_V9_OSMDROID_NATIVE/app/src/main/res/mipmap-anydpi-v26
          mkdir -p BOUH_V9_OSMDROID_NATIVE/app/src/main/assets/data
          cat > BOUH_V9_OSMDROID_NATIVE/settings.gradle <<'EOF'
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name='BOUH V9 OSMDROID NATIVE'
include ':app'
EOF
          cat > BOUH_V9_OSMDROID_NATIVE/build.gradle <<'EOF'
plugins { id 'com.android.application' version '8.6.1' apply false }
EOF
          cat > BOUH_V9_OSMDROID_NATIVE/app/build.gradle <<'EOF'
plugins { id 'com.android.application' }

android {
    namespace 'com.bouh.v9osmdroid'
    compileSdk 35
    defaultConfig { applicationId 'com.bouh.v9osmdroid'; minSdk 23; targetSdk 35; versionCode 9; versionName '9.0.0-osmdroid-native' }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite:2.3.1'
}
EOF
          cat > BOUH_V9_OSMDROID_NATIVE/app/src/main/res/values/styles.xml <<'EOF'
<resources>
    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
        <item name="android:windowLightStatusBar">false</item>
        <item name="android:statusBarColor">#050505</item>
        <item name="android:navigationBarColor">#050505</item>
        <item name="android:windowNoTitle">true</item>
    </style>
</resources>
EOF

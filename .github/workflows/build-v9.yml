          cat > BOUH_V9_OSMDROID_NATIVE/app/src/main/java/com/bouh/v9osmdroid/MainActivity.java <<'EOF'
package com.bouh.v9osmdroid;

import android.Manifest;import android.app.*;import android.os.*;import android.content.*;import android.content.pm.PackageManager;import android.graphics.*;import android.graphics.drawable.*;import android.location.*;import android.view.*;import android.widget.*;import org.json.*;import org.osmdroid.config.Configuration;import org.osmdroid.tileprovider.tilesource.*;import org.osmdroid.util.*;import org.osmdroid.views.*;import org.osmdroid.views.overlay.*;import org.osmdroid.views.CustomZoomButtonsController;import java.io.*;import java.nio.charset.StandardCharsets;import java.util.*;

public class MainActivity extends Activity{
  MapView map; TextView lat,lon,base,decision; LinearLayout sheet; LocationManager lm; ArrayList<Target> targets=new ArrayList<>(); ITileSource esri;
  static class Target{String id,name,status,cls;double lat,lon,ipi;Target(String a,String b,double c,double d,String e,double f,String g){id=a;name=b;lat=c;lon=d;status=e;ipi=f;cls=g;}}
  public void onCreate(Bundle b){super.onCreate(b);Configuration.getInstance().setUserAgentValue(getPackageName());Configuration.getInstance().setOsmdroidBasePath(getCacheDir());Configuration.getInstance().setOsmdroidTileCache(getCacheDir());lm=(LocationManager)getSystemService(LOCATION_SERVICE);loadTargets();setupSources();ui();setupMap();if(Build.VERSION.SDK_INT>=23)requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION,Manifest.permission.ACCESS_COARSE_LOCATION},9);}
  void setupSources(){esri=new OnlineTileSourceBase("Esri World Imagery",0,19,256,"",new String[]{"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/"}){public String getTileURLString(long idx){return getBaseUrl()+MapTileIndex.getZoom(idx)+"/"+MapTileIndex.getY(idx)+"/"+MapTileIndex.getX(idx);}};}
  void ui(){FrameLayout root=new FrameLayout(this);map=new MapView(this);root.addView(map,new FrameLayout.LayoutParams(-1,-1));LinearLayout top=new LinearLayout(this);top.setOrientation(LinearLayout.VERTICAL);top.setPadding(dp(10),dp(8),dp(10),dp(8));top.setBackgroundColor(Color.rgb(8,8,6));TextView title=txt("بوح التضاريس\nBOUH OSMDROID NATIVE V9\nتطوير: أحمد أبو عزيزه الرشيدي",20,Color.WHITE,true);title.setGravity(Gravity.CENTER);top.addView(title);TextView eng=txt("BOUH SUPREME v9 — OSMDROID / REAL MAP ENGINE",15,Color.rgb(190,255,195),true);eng.setGravity(Gravity.CENTER);eng.setBackground(bg(Color.rgb(18,60,24),Color.rgb(45,125,58),16));top.addView(eng,new LinearLayout.LayoutParams(-1,dp(58)));root.addView(top,place(-1,dp(150),Gravity.TOP));
    LinearLayout tools=new LinearLayout(this);tools.setOrientation(LinearLayout.VERTICAL);String[] arr={"+","−","▣","AI","⌖"};for(String s:arr){Button bt=btn(s);tools.addView(bt,new LinearLayout.LayoutParams(dp(64),dp(64)));if(s.equals("+"))bt.setOnClickListener(v->{map.getController().zoomIn();hud();});if(s.equals("−"))bt.setOnClickListener(v->{map.getController().zoomOut();hud();});if(s.equals("▣"))bt.setOnClickListener(v->showMaps());if(s.equals("AI"))bt.setOnClickListener(v->analyze());if(s.equals("⌖"))bt.setOnClickListener(v->gps());}root.addView(tools,place(dp(80),-2,Gravity.RIGHT|Gravity.CENTER_VERTICAL));
    LinearLayout h=new LinearLayout(this);h.setOrientation(LinearLayout.VERTICAL);h.setPadding(dp(10),dp(10),dp(10),dp(10));h.setBackground(bg(Color.argb(230,8,8,6),Color.rgb(64,51,30),22));LinearLayout r1=new LinearLayout(this),r2=new LinearLayout(this);r1.setOrientation(LinearLayout.HORIZONTAL);r2.setOrientation(LinearLayout.HORIZONTAL);lon=cell("Longitude","36.480000");lat=cell("Latitude","19.800000");decision=cell("Decision","HOLD");base=cell("Base","OSM");r1.addView(lon,new LinearLayout.LayoutParams(0,dp(72),1));r1.addView(lat,new LinearLayout.LayoutParams(0,dp(72),1));r2.addView(decision,new LinearLayout.LayoutParams(0,dp(72),1));r2.addView(base,new LinearLayout.LayoutParams(0,dp(72),1));h.addView(r1);h.addView(r2);root.addView(h,place(-1,dp(170),Gravity.BOTTOM));
    LinearLayout nav=new LinearLayout(this);nav.setOrientation(LinearLayout.HORIZONTAL);nav.setBackgroundColor(Color.rgb(8,8,7));String[] tabs={"الأمان","GPZ","الأهداف","الخرائط","الحكم"};for(String t:tabs){TextView tv=txt(t,14,Color.rgb(205,190,150),true);tv.setGravity(Gravity.CENTER);nav.addView(tv,new LinearLayout.LayoutParams(0,dp(82),1));if(t.equals("الأمان"))tv.setOnClickListener(v->showSecurity());if(t.equals("GPZ"))tv.setOnClickListener(v->showGpz());if(t.equals("الأهداف"))tv.setOnClickListener(v->showTargets());if(t.equals("الخرائط"))tv.setOnClickListener(v->showMaps());if(t.equals("الحكم"))tv.setOnClickListener(v->showDashboard());}root.addView(nav,place(-1,dp(82),Gravity.BOTTOM));sheet=new LinearLayout(this);sheet.setOrientation(LinearLayout.VERTICAL);sheet.setBackground(bg(Color.rgb(247,242,228),Color.TRANSPARENT,24));sheet.setVisibility(View.GONE);root.addView(sheet,place(-1,-2,Gravity.BOTTOM));setContentView(root);}
  void setupMap(){map.setTileSource(TileSourceFactory.MAPNIK);map.setMultiTouchControls(true);map.getZoomController().setVisibility(CustomZoomButtonsController.Visibility.NEVER);map.getController().setZoom(12.0);map.getController().setCenter(new GeoPoint(19.8,36.48));for(Target t:targets){Marker m=new Marker(map);m.setPosition(new GeoPoint(t.lat,t.lon));m.setTitle(t.id+" — "+t.name);m.setSubDescription(t.status+" | IPI "+t.ipi+" | "+t.cls);map.getOverlays().add(m);Polygon c=new Polygon(map);c.setPoints(Polygon.pointsAsCircle(new GeoPoint(t.lat,t.lon),t.cls.contains("GPZ")?1200:900));c.getFillPaint().setColor(Color.argb(50,216,181,106));c.getOutlinePaint().setColor(t.cls.contains("GPZ")?Color.rgb(255,226,160):Color.rgb(115,213,255));c.getOutlinePaint().setStrokeWidth(3);map.getOverlays().add(c);}addLines();map.addMapListener(e->{hud();return false;});hud();}
  void addLines(){double[][][] lines={{{19.75,36.42},{19.82,36.50},{19.95,36.70}},{{19.86,36.82},{19.98,36.77},{20.15,36.66}},{{20.60,36.36},{20.67,36.43},{20.93,36.49}}};for(double[][] l:lines){Polyline p=new Polyline(map);ArrayList<GeoPoint> pts=new ArrayList<>();for(double[] a:l)pts.add(new GeoPoint(a[0],a[1]));p.setPoints(pts);p.getOutlinePaint().setColor(Color.rgb(115,213,255));p.getOutlinePaint().setStrokeWidth(5);map.getOverlays().add(p);}}
  void switchBase(int i){if(i==0)map.setTileSource(TileSourceFactory.MAPNIK);else if(i==1)map.setTileSource(new XYTileSource("OpenTopoMap",0,17,256,".png",new String[]{"https://a.tile.opentopomap.org/"}));else map.setTileSource(esri);base.setText(i==0?"OSM":i==1?"TOPO":"IMG");hide();map.invalidate();}
  void analyze(){GeoPoint c=(GeoPoint)map.getMapCenter();Target near=null;double best=1e12;for(Target t:targets){double d=c.distanceToAsDouble(new GeoPoint(t.lat,t.lon));if(d<best){best=d;near=t;}}double ipi=45+Math.exp(-best/20000.0)*35;String st=ipi>65?"FIELD-CHECK":"HOLD";decision.setText(st);toast("الحكم "+st+" | IPI "+String.format("%.1f",ipi)+" | أقرب "+(near!=null?near.id:"NA"));}
  void gps(){try{if(Build.VERSION.SDK_INT>=23&&checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)!=PackageManager.PERMISSION_GRANTED){toast("لا يوجد إذن GPS");return;}Location best=null;for(String p:lm.getProviders(true)){Location l=lm.getLastKnownLocation(p);if(l!=null&&(best==null||l.getAccuracy()<best.getAccuracy()))best=l;}if(best==null){toast("لا يوجد تثبيت GPS");return;}GeoPoint g=new GeoPoint(best.getLatitude(),best.getLongitude());map.getController().animateTo(g);map.getController().setZoom(16.0);Marker me=new Marker(map);me.setPosition(g);me.setTitle("موقعي الحالي");me.setSubDescription("GPS ±"+Math.round(best.getAccuracy())+"m");map.getOverlays().add(me);map.invalidate();}catch(Exception e){toast("GPS غير متاح");}}
  void begin(String title){sheet.removeAllViews();LinearLayout h=new LinearLayout(this);h.setGravity(Gravity.CENTER_VERTICAL);h.setPadding(dp(16),dp(8),dp(16),dp(8));TextView x=txt("×",32,Color.BLACK,false),tt=txt(title,24,Color.BLACK,true),vv=txt("V9",12,Color.rgb(216,181,106),true);h.addView(x,new LinearLayout.LayoutParams(dp(58),dp(60)));h.addView(tt,new LinearLayout.LayoutParams(0,dp(60),1));h.addView(vv,new LinearLayout.LayoutParams(dp(48),dp(60)));x.setOnClickListener(v->hide());sheet.addView(h);sheet.setVisibility(View.VISIBLE);}
  View item(String ic,String t,String sub,View.OnClickListener l){LinearLayout r=new LinearLayout(this);r.setGravity(Gravity.CENTER_VERTICAL);r.setPadding(dp(16),dp(10),dp(16),dp(10));TextView i=txt(ic,26,Color.BLACK,false),tx=txt(t+"\n"+sub,17,Color.rgb(20,18,12),true);r.addView(i,new LinearLayout.LayoutParams(dp(54),dp(76)));r.addView(tx,new LinearLayout.LayoutParams(0,dp(76),1));if(l!=null)r.setOnClickListener(l);return r;}
  void showMaps(){begin("الخرائط");sheet.addView(item("🛰","Esri World Imagery","صور فضائية مباشرة",v->switchBase(2)));sheet.addView(item("🌍","OpenStreetMap","خريطة مباشرة",v->switchBase(0)));sheet.addView(item("⛰","OpenTopoMap","تضاريس مباشرة",v->switchBase(1)));sheet.addView(item("▱","خطوط وأهداف","Overlays مفعلة فوق الخريطة",null));}
  void showTargets(){begin("الأهداف");for(Target t:targets)sheet.addView(item("⚑",t.id+" — "+t.name,t.cls+" | "+t.status+" | IPI "+t.ipi,v->{map.getController().animateTo(new GeoPoint(t.lat,t.lon));map.getController().setZoom(16.0);hide();}));}
  void showDashboard(){begin("الحكم");sheet.addView(item("▦","لوحة الحكم","Structure → Pattern → Alteration → Confirmation → Decision",null));sheet.addView(item("AI","تحليل مركز الخريطة","تشغيل فوري",v->{hide();analyze();}));sheet.addView(item("＋","حفظ سجل مشفر","النقطة الحالية",v->{toast("تم الحفظ المشفر");hide();}));}
  void showGpz(){begin("GPZ");sheet.addView(item("◎","GPZ 7000","مساعد ميداني لا يثبت الذهب وحده",null));sheet.addView(item("⚙","إعداد مقترح","High Yield / Difficult / Sensitivity 8–11",null));sheet.addView(item("📏","قاعدة 30cm","أبعد الهاتف عن الكويل والبطارية",null));}
  void showSecurity(){begin("الأمان");sheet.addView(item("🌐","INTERNET ENABLED","خرائط مباشرة",null));sheet.addView(item("🔐","SQLCipher / AES","مكتبات مضافة وسجل محلي",null));sheet.addView(item("⌫","مسح آمن","حذف السجلات",v->{toast("تم المسح");hide();}));}
  void hide(){sheet.setVisibility(View.GONE);}void hud(){GeoPoint c=(GeoPoint)map.getMapCenter();if(lat!=null)lat.setText(String.format("%.6f\nLatitude",c.getLatitude()));if(lon!=null)lon.setText(String.format("%.6f\nLongitude",c.getLongitude()));}
  void loadTargets(){try{BufferedReader br=new BufferedReader(new InputStreamReader(getAssets().open("data/targets.json"),StandardCharsets.UTF_8));StringBuilder sb=new StringBuilder();String line;while((line=br.readLine())!=null)sb.append(line);JSONArray arr=new JSONObject(sb.toString()).getJSONArray("targets");for(int i=0;i<arr.length();i++){JSONObject o=arr.getJSONObject(i);targets.add(new Target(o.getString("id"),o.getString("name"),o.getDouble("lat"),o.getDouble("lon"),o.getString("status"),o.getDouble("ipi"),o.getString("cls")));}}catch(Exception e){targets.add(new Target("ARB-T1","Arbaat GPZ-Regolith",19.973186,36.745590,"HOLD+",71.4,"GPZ-Regolith"));}}
  TextView txt(String s,int sp,int col,boolean bold){TextView v=new TextView(this);v.setText(s);v.setTextSize(sp);v.setTextColor(col);v.setGravity(Gravity.CENTER);if(bold)v.setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD);return v;}TextView cell(String lab,String val){TextView v=txt(val+"\n"+lab,19,Color.WHITE,true);v.setBackground(bg(Color.rgb(16,16,13),Color.rgb(43,39,26),14));return v;}Button btn(String s){Button b=new Button(this);b.setText(s);b.setTextSize(18);b.setTextColor(Color.rgb(255,226,160));b.setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD);b.setBackground(bg(Color.rgb(10,10,9),Color.rgb(59,51,33),18));return b;}GradientDrawable bg(int c,int st,int r){GradientDrawable g=new GradientDrawable();g.setColor(c);g.setCornerRadius(dp(r));if(st!=Color.TRANSPARENT)g.setStroke(1,st);return g;}FrameLayout.LayoutParams place(int w,int h,int gr){FrameLayout.LayoutParams p=new FrameLayout.LayoutParams(w,h);p.gravity=gr;return p;}int dp(int v){return (int)(v*getResources().getDisplayMetrics().density+0.5f);}void toast(String s){Toast.makeText(this,s,Toast.LENGTH_LONG).show();try{((Vibrator)getSystemService(VIBRATOR_SERVICE)).vibrate(30);}catch(Exception e){}}public void onResume(){super.onResume();if(map!=null)map.onResume();}public void onPause(){super.onPause();if(map!=null)map.onPause();}
}
EOF
          cat > BOUH_V9_OSMDROID_NATIVE/README_BOUH_V9_AR.md <<'EOF'
# بوح التضاريس V9 — Osmdroid Native
نسخة Android Native بمحرك Osmdroid الحقيقي: MapView، طبقات، GPS، أهداف، خطوط بنيوية، SQLCipher dependency.
EOF
      - name: Build APK
        run: |
          cd BOUH_V9_OSMDROID_NATIVE
          gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Package outputs
        run: |
          mkdir -p output
          cp BOUH_V9_OSMDROID_NATIVE/app/build/outputs/apk/debug/app-debug.apk output/BOUH_V9_OSMDROID_NATIVE-debug.apk
          cp BOUH_V9_OSMDROID_NATIVE/app/src/main/AndroidManifest.xml output/AndroidManifest_V9.xml
          cp BOUH_V9_OSMDROID_NATIVE/README_BOUH_V9_AR.md output/README_BOUH_V9_AR.md
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_V9_OSMDROID_NATIVE_APK
          path: output/*
